services:
  dvdrewind:
    build: .
    container_name: dvdrewind
    restart: unless-stopped
    init: true
    ports:
      - "8088:8088"
    volumes:
      # Map host directory for persistent SQLite database, posters & archives
      # The image runs as uid 1000 / gid 100: make ./archive writable by them,
      # e.g. `sudo chown -R 1000:100 archive`.
      - ./archive:/app/archive
    environment:
      - PYTHONUNBUFFERED=1
      # Optional: keep the SQLite DB outside ./archive, e.g. on a plain disk when
      # ./archive sits on a FUSE pool such as mergerfs (mount its folder at /app/db)
      # - DVDREWIND_DB_PATH=/app/db/dvdrewind.db
      # Optional: lets archive controls (sync, backfill, vacuum) work from non-localhost browsers
      - DVDREWIND_ADMIN_TOKEN=${DVDREWIND_ADMIN_TOKEN}
      # Optional TMDB API key override (default built-in key works out of the box)
      # - TMDB_API_KEY=your_api_key_here
