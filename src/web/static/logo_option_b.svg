<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 90" width="100%" height="100%" fill="none" style="shape-rendering: geometricPrecision;">
  <defs>
    <linearGradient id="optB_goldChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="25%" stop-color="#FED7AA"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="optB_plate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="85%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="optB_subBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="optB_shadow" x="-5%" y="-15%" width="115%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#optB_shadow)">
    <!-- Seamless Wide Parallelogram Monolith -->
    <path d="M 38 12 L 744 12 L 710 78 L 4 78 Z" fill="url(#optB_plate)" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 40 14 L 742 14 L 708 76 L 6 76 Z" fill="none" stroke="#000000" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Left side Rewind Chevron Cutouts (<<) -->
    <polygon points="62,24 30,44 62,64" fill="#0A0E17"/>
    <polygon points="62,24 58,28 35,44 58,60 62,64" fill="#000000"/>
    <polygon points="62,24 30,44 33,46 62,28" fill="#FFFFFF" fill-opacity="0.5"/>

    <polygon points="96,24 64,44 96,64" fill="#0A0E17"/>
    <polygon points="96,24 92,28 69,44 92,60 96,64" fill="#000000"/>
    <polygon points="96,24 64,44 67,46 96,28" fill="#FFFFFF" fill-opacity="0.5"/>

    <!-- 'rewind' Master Typography -->
    <text x="110" y="58" font-family="'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="46" fill="#0B0F17" letter-spacing="-1.5">rewind</text>
    <text x="108" y="56" font-family="'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="46" fill="#000000" letter-spacing="-1.5">rewind</text>
    <text x="108" y="55" font-family="'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="46" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.7" letter-spacing="-1.5">rewind</text>

    <!-- Slanted Inset Vault Badge on Right -->
    <path d="M 335 18 L 722 18 L 696 72 L 309 72 Z" fill="url(#optB_subBanner)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.4"/>
    
    <text x="350" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-size="25" fill="#F8FAFC" letter-spacing="3.5">PRIVATE ARCHIVE</text>
    <text x="352" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#38BDF8" letter-spacing="2.8">EST. 2026 &bull; 4K UHD &bull; BLU-RAY &bull; DVD</text>

    <polygon points="675,28 683,44 675,60 667,44" fill="url(#optB_goldChrome)" stroke="#FFE4E6" stroke-width="0.8"/>
  </g>
</svg>