<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 90" width="100%" height="100%" fill="none" style="shape-rendering: geometricPrecision;">
  <defs>
    <linearGradient id="optA_plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="20%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="optA_rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="optA_darkPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="optA_chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="optA_rewindCut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="optA_cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="optA_shadow" x="-5%" y="-15%" width="115%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#optA_shadow)">
    <rect x="6" y="6" width="748" height="78" rx="14" fill="#090D14" stroke="url(#optA_rim)" stroke-width="2.5"/>

    <!-- Left section: Brushed Aluminum Rewind Badge -->
    <path d="M 24 16 L 380 16 L 350 74 L 14 74 Z" fill="url(#optA_plate)" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 24 16 L 380 16 L 350 74 L 14 74 Z" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.25"/>

    <!-- 3D Beveled Rewind Chevrons (<<) -->
    <polygon points="65,27 35,45 65,63" fill="url(#optA_rewindCut)"/>
    <polygon points="65,27 61,31 39,45 61,59 65,63" fill="#000000"/>
    <polygon points="65,27 35,45 38,47 65,31" fill="#FFFFFF" fill-opacity="0.45"/>

    <polygon points="98,27 68,45 98,63" fill="url(#optA_rewindCut)"/>
    <polygon points="98,27 94,31 72,45 94,59 98,63" fill="#000000"/>
    <polygon points="98,27 68,45 71,47 98,31" fill="#FFFFFF" fill-opacity="0.45"/>

    <!-- 3D Extruded 'rewind' Typography -->
    <text x="114" y="58" font-family="'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0B0F17" letter-spacing="-1.5">rewind</text>
    <text x="113" y="57" font-family="'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#1E293B" letter-spacing="-1.5">rewind</text>
    <text x="111" y="55" font-family="'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#05070A" letter-spacing="-1.5">rewind</text>
    <text x="111" y="54" font-family="'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="44" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.6" letter-spacing="-1.5">rewind</text>

    <!-- Center Vertical Inset Chasm / Milled Divider -->
    <line x1="392" y1="18" x2="368" y2="72" stroke="#000000" stroke-width="3"/>
    <line x1="394" y1="18" x2="370" y2="72" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

    <!-- Right section: PRIVATE ARCHIVE Embedded Obsidian Plaque -->
    <rect x="395" y="16" width="345" height="58" rx="8" fill="url(#optA_darkPlate)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.2"/>
    <rect x="399" y="20" width="337" height="50" rx="6" fill="none" stroke="rgba(0, 0, 0, 0.6)" stroke-width="1"/>
    
    <!-- Status Gem Indicator -->
    <circle cx="422" cy="45" r="4.5" fill="url(#optA_cyanGlow)"/>
    <circle cx="422" cy="45" r="7" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5"/>

    <!-- PRIVATE ARCHIVE Text -->
    <text x="442" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="url(#optA_chromeText)" letter-spacing="3.5">PRIVATE ARCHIVE</text>
    <text x="443" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#64748B" letter-spacing="3.2">OFFLINE REFERENCE VAULT</text>
  </g>
</svg>